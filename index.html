<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1a2b">
<title>DODS 3000</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤿</text></svg>">
</head>
<body>
<canvas id="scene"></canvas>

<div id="vignette"></div>
<div id="flash"></div>

<!-- TITRE -->
<section id="s-title" class="screen">
  <div class="title-wrap">
    <h1 class="logo">DODS<span>3000</span></h1>
    <p class="tag">Championnat de dødsing</p>
    <button class="btn big" data-go="spots">JOUER</button>
    <p class="hint">Espace ou tap pour tout faire</p>
    <p class="version" id="version"></p>
  </div>
</section>

<!-- SELECTION DE SPOT -->
<section id="s-spots" class="screen">
  <header class="bar">
    <button class="btn ghost" data-go="title">&lt;</button>
    <h2>CHOISIS TON SPOT</h2>
    <div class="total">TOTAL <b id="total-score">0</b></div>
  </header>
  <div id="spot-list"></div>
</section>

<!-- BRIEF DU SPOT -->
<section id="s-brief" class="screen">
  <div class="card brief">
    <div class="brief-head">
      <h2 id="brief-name"></h2>
      <p id="brief-place"></p>
    </div>
    <div class="stats">
      <div><span id="brief-height"></span><small>hauteur</small></div>
      <div><span id="brief-diff"></span><small>difficulté</small></div>
      <div><span id="brief-best"></span><small>record</small></div>
    </div>
    <p id="brief-note" class="note"></p>
    <div class="row">
      <button class="btn ghost" data-go="spots">Retour</button>
      <button class="btn big" data-go="run">3 SAUTS, GO</button>
    </div>
  </div>
</section>

<!-- HUD EN JEU -->
<section id="s-run" class="screen hud">
  <div class="hud-top">
    <div class="hud-cell"><small>SAUT</small><b id="hud-jump">1/3</b></div>
    <div class="hud-cell center"><small id="hud-spot"></small><b id="hud-score">0</b><small id="hud-streak"></small></div>
    <div class="hud-cell right"><small>ALTITUDE</small><b id="hud-alt">0 m</b></div>
  </div>

  <div id="runbar"><div id="runbar-fill"></div><div id="runbar-zone"></div></div>

  <div id="tuckring">
    <svg viewBox="0 0 120 120">
      <circle class="tr-bg" cx="60" cy="60" r="52"></circle>
      <circle class="tr-zone" cx="60" cy="60" r="52"></circle>
      <circle class="tr-arc" cx="60" cy="60" r="52"></circle>
    </svg>
    <div id="tuckring-label">DØDS</div>
  </div>

  <div id="pause">
    <div class="card pause-card">
      <h2>EN PAUSE</h2>
      <p>L'onglet est passé en arrière plan. Le saut reprend où il s'est arrêté.</p>
      <button class="btn big" id="pause-resume">REPRENDRE</button>
    </div>
  </div>

  <div id="callout"></div>
  <div id="toast"></div>
  <div id="prompt"></div>
</section>

<!-- RESULTAT DU SAUT -->
<section id="s-jump" class="screen overlay">
  <div class="card result">
    <h2 id="jr-grade"></h2>
    <p id="jr-sub"></p>
    <p id="jr-timing"></p>
    <div id="jr-gauge" aria-hidden="true">
      <div class="g-track">
        <span class="g-bands">
          <span class="g-zone good"></span>
          <span class="g-zone great"></span>
          <span class="g-zone perfect"></span>
          <span class="g-zone smack"></span>
        </span>
        <span class="g-mark"></span>
      </div>
      <div class="g-ends"><span>trop tôt</span><span>eau</span></div>
    </div>
    <ul class="breakdown" id="jr-lines"></ul>
    <button class="btn big" id="jr-next">SUITE</button>
  </div>
</section>

<!-- FIN DE RUN -->
<section id="s-end" class="screen overlay">
  <div class="card result">
    <h2 id="end-title"></h2>
    <p id="end-sub"></p>
    <div class="final" id="end-score">0</div>
    <p id="end-best" class="note"></p>
    <div class="row">
      <button class="btn ghost" data-go="spots">Spots</button>
      <button class="btn big" data-go="run">REJOUER</button>
    </div>
  </div>
</section>

<button id="sound" class="btn ghost icon" type="button" aria-pressed="false" title="Couper le son">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path class="horn" d="M4 9.2h3.8L12.4 5.2v13.6L7.8 14.8H4z"/>
    <path class="wave" d="M15.6 9.1a4.2 4.2 0 0 1 0 5.8M18.3 6.6a7.8 7.8 0 0 1 0 10.8"/>
    <path class="slash" d="M16.2 9.6l5.4 4.8M21.6 9.6l-5.4 4.8"/>
  </svg>
  <span class="sr">Son</span>
</button>

<div id="loading">chargement…</div>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
