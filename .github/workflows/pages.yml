name: pages

on:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: write

concurrency:
  group: gh-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Epinglee au SHA du commit, pas au tag : un tag se deplace, un SHA non.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Controles
        run: sh check.sh

      # Le seul endroit d'ou le CDN est joignable : on confronte ici le hash de
      # l'importmap aux octets reellement servis. S'ils divergent, rien ne se deploie.
      - name: Integrity de three
        run: |
          url=$(grep -oE 'https://cdn\.jsdelivr\.net/npm/three@[^"]+' index.html | head -1)
          attendu=$(grep -oE 'sha384-[A-Za-z0-9+/=]+' index.html | head -1)
          curl -fsSL "$url" -o /tmp/three.module.js
          obtenu="sha384-$(openssl dgst -sha384 -binary /tmp/three.module.js | openssl base64 -A)"
          echo "url     : $url"
          echo "attendu : $attendu"
          echo "obtenu  : $obtenu"
          [ "$obtenu" = "$attendu" ] || { echo "::error::le CDN ne sert pas les octets attendus"; exit 1; }

      - name: Construire _site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html style.css _site/
          cp -r src _site/

      - name: Calculer le dossier de destination
        id: dest
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
          else
            echo "dir=preview/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier sur gh-pages
        # Action tierce qui tourne avec contents:write : epinglee au SHA.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
          destination_dir: ${{ steps.dest.outputs.dir }}
